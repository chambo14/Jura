# Met en ligne l'application sur l'hébergement mutualisé LWS.
#
# L'hébergement n'offre ni SSH ni Composer ni Node : on ne peut y déposer que
# des fichiers déjà prêts. Ce workflow reconstitue donc ici ce qu'une machine
# de développement produirait — les dépendances PHP et les assets compilés —
# puis dépose l'ensemble par FTPS.
#
# Ce qu'il ne fait PAS, volontairement :
#   - il ne supprime jamais de fichier sur le serveur (pas de --delete) ;
#   - il n'écrase ni .env, ni la base SQLite, ni les journaux (voir EXCLUSIONS) ;
#   - il n'exécute aucune migration : modifier la structure de la base demande
#     une ligne de commande, que cet hébergement n'a pas. Voir README.
name: deploy

on:
  # Déclenchement manuel uniquement, depuis l'onglet Actions.
  #
  # Le dépôt réécrit 226 fichiers, dont 180 exécutables : pendant la minute
  # que dure le transfert, une page chargée au mauvais moment peut échouer.
  # Tant que des personnes testent l'application en ligne, c'est à un humain
  # de choisir le moment — pas à un push.
  #
  # Une fois la chaîne éprouvée et les tests terminés, décommenter ce bloc
  # pour que toute fusion dans main parte en ligne automatiquement :
  #
  # push:
  #   branches:
  #     - main
  workflow_dispatch:

permissions:
  contents: read

# Deux dépôts FTP simultanés se marcheraient dessus : on sérialise.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # La version doit correspondre à celle du serveur : composer.lock épingle
      # des composants Symfony qui exigent PHP >= 8.4.1.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # --no-dev écarte Pint, PHPStan et PHPUnit : inutiles en production, et
      # autant de fichiers en moins à transférer.
      - name: Installer les dépendances PHP
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Compiler les assets
        run: |
          npm ci
          npm run build

      # Sans ce garde-fou, une compilation muette déposerait un site sans styles.
      - name: Vérifier que les assets existent
        run: test -s public/build/manifest.json

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Identifier le certificat du serveur FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          # Le nom auquel le certificat est émis est une donnée publique, mais
          # elle n'est lisible qu'en interrogeant le serveur. L'hébergement
          # mutualisé présente en général le certificat de la machine, pas
          # celui du domaine hébergé : c'est ce nom-là qu'il faut demander.
          echo "::group::Certificat présenté par le serveur"
          openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" \
            </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -ext subjectAltName \
            || echo "Certificat illisible : le serveur a refusé la négociation."
          echo "::endgroup::"

      - name: Vérifier la connexion FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # Le test doit provoquer une vraie entrée-sortie réseau. « pwd » n'en
          # provoque aucune : lftp y répond localement, sans jamais ouvrir la
          # connexion, et l'étape réussissait donc sans rien avoir vérifié.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 30;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_HOST';
            cls -1 .;
          " > /dev/null

      - name: Localiser le projet sur le serveur
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          reglages="
            set ftp:ssl-force true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 30;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_HOST';
          "

          # Un compte FTP cPanel est cloisonné dans son répertoire : la racine
          # qu'il voit n'est pas celle du serveur, et son emplacement exact
          # n'est pas connaissable depuis ici. On journalise donc ce qu'il voit
          # réellement, puis on cherche artisan plutôt que de parier.
          echo "::group::Arborescence visible par le compte FTP"
          lftp -c "$reglages pwd; cls -1 .;" || true
          echo "::endgroup::"

          echo "Recherche de artisan (profondeur 4)…"
          trouves=$(lftp -c "$reglages find -d 4 .;" 2>/dev/null | grep -E '(^|/)artisan$' || true)

          if [ -z "$trouves" ]; then
            echo "::error::artisan est introuvable dans l'arborescence visible par ce compte FTP. Il est probablement cloisonné hors du projet : dans cPanel, ouvrez Comptes FTP et donnez-lui pour répertoire /home/<compte>/public_html/gestproject."
            exit 1
          fi

          # Le chemin le plus court est le projet lui-même ; les plus longs
          # seraient des copies enfouies, à ignorer.
          chemin=$(echo "$trouves" | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
          dossier=$(dirname "$chemin")

          echo "Projet trouvé dans : $dossier"
          echo "DOSSIER_DISTANT=$dossier" >> "$GITHUB_ENV"

      - name: Déposer par FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # EXCLUSIONS — chaque ligne protège quelque chose qui n'existe que sur
          # le serveur et que le dépôt ne doit jamais recouvrir.
          COMMUNES="
            --exclude '^\.git'
            --exclude '^\.env'
            --exclude '^node_modules/'
            --exclude '^tests/'
            --exclude '^database/[^/]*\.sqlite'
            --exclude '^storage/logs/'
            --exclude '^storage/app/'
            --exclude '^storage/framework/(cache|sessions|views)/'
            --exclude '^bootstrap/cache/'
          "

          # Deux passes, parce que les deux moitiés ne se comparent pas pareil.
          #
          # 1. Le code applicatif : quelques centaines de kilo-octets. Les dates
          #    sont toujours celles du checkout, donc tout repart à chaque fois —
          #    c'est voulu, c'est la seule comparaison qui ne rate jamais une
          #    modification, et le volume est négligeable.
          #
          # 2. vendor/ : dix mille fichiers pour cinquante méga-octets. Comparés
          #    par date ils repartiraient intégralement à chaque mise en ligne,
          #    pour vingt minutes de transfert inutile. On compare donc leur
          #    taille : Composer réécrit ces fichiers à l'identique tant que
          #    composer.lock ne bouge pas, et les régénère quand il bouge.
          #
          # Aucune des deux passes n'utilise --delete : rien n'est jamais
          # supprimé sur le serveur.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            set net:timeout 30;
            open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_HOST';

            mirror --reverse --parallel=4 --verbose=1 \
              $COMMUNES --exclude '^vendor/' \
              ./ '$DOSSIER_DISTANT'/;

            mirror --reverse --parallel=4 --verbose=1 --size-only \
              ./vendor/ '$DOSSIER_DISTANT'/vendor/;
          "
